plugins {
    id 'com.android.application'
}

android {
    namespace 'ee.opetaja.abiline'
    compileSdk 34

    defaultConfig {
        applicationId 'ee.opetaja.abiline'
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug   // simple self-signed APK for sideloading
        }
    }
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
